name: Build LAN ANH CLIENT

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Repo có thể để source ở gốc (có build.gradle) HOẶC để dạng file .zip.
      - name: Locate Gradle project
        id: src
        run: |
          set -euo pipefail

          if [ -f build.gradle ] && [ -f settings.gradle ]; then
            DIR="."
          else
            found=""
            for ZIP in *.zip; do
              [ -e "$ZIP" ] || continue
              echo "Thử giải nén: $ZIP"
              rm -rf proj
              mkdir proj
              unzip -q "$ZIP" -d proj
              BUILD_FILE="$(find proj -name build.gradle -print -quit)"
              if [ -n "$BUILD_FILE" ]; then
                found="$BUILD_FILE"
                break
              fi
            done

            if [ -z "$found" ]; then
              echo "::error::Không tìm thấy build.gradle ở gốc repo hoặc trong file .zip nào"
              exit 1
            fi
            DIR="$(dirname "$found")"
          fi

          echo "Thư mục project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build mod
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle build --no-daemon

      # Chỉ lấy jar release. Bỏ *-dev.jar (chưa remap, không chạy trong game) và *-sources.jar.
      - name: Collect release jar
        env:
          PROJECT_DIR: ${{ steps.src.outputs.dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          copied=0
          for jar in "$GITHUB_WORKSPACE/$PROJECT_DIR"/build/libs/*.jar; do
            case "$(basename "$jar")" in
              *-dev.jar|*-sources.jar) continue ;;
            esac
            cp "$jar" release/
            copied=$((copied + 1))
          done
          if [ "$copied" -eq 0 ]; then
            echo "::error::Không có jar release nào trong build/libs"
            ls -la "$GITHUB_WORKSPACE/$PROJECT_DIR/build/libs" || true
            exit 1
          fi
          ls -la release

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LanAnhClient-jar
          path: release/*.jar
          if-no-files-found: error
          retention-days: 14

name: Build LAN ANH CLIENT

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Chuẩn bị source (tự giải nén zip nếu cần)
        run: |
          if [ -f build.gradle ]; then
            echo "SRC=." >> "$GITHUB_ENV"
          else
            ZIP=$(ls *.zip | head -n1)
            echo "Giải nén: $ZIP"
            unzip -q "$ZIP" -d proj
            GRADLE=$(find proj -maxdepth 3 -name build.gradle | head -n1)
            test -n "$GRADLE"
            echo "SRC=$(dirname "$GRADLE")" >> "$GITHUB_ENV"
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Kiểm tra file
        working-directory: ${{ env.SRC }}
        run: |
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties

      - name: Build mod
        working-directory: ${{ env.SRC }}
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LanAnhClient-jar
          path: |
            ${{ env.SRC }}/build/libs/*.jar
            !${{ env.SRC }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
